---
# Baseline dev bootstrap: installs the agent on a Lima VM, Colima VM, or localhost
# (Linux). Run via: make dev-deploy
#
# Override with -e: baseline_agent_binary (path to the linux binary),
# baseline_otlp_endpoint (OTLP/HTTP receiver; omit for stdout export).

- name: Bootstrap baseline agent on dev node
  hosts: fleet
  become: true
  vars:
    baseline_heartbeat_interval_sec: 30
    baseline_audit_interval_sec: 120
    baseline_audit_jitter_max_sec: 10
    baseline_manifest_files:
      - /etc/baseline/sentinel
      - /etc/motd

  tasks:
    - name: Create config directory
      ansible.builtin.file:
        path: /etc/baseline
        state: directory
        mode: "0755"

    - name: Write dev baseline files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - dest: /etc/baseline/sentinel
          content: |
            # managed by baseline — do not edit
            version: 1
            state: ok
        - dest: /etc/motd
          content: "Authorized access only. Activity is monitored by Baseline.\n"

    - name: Install and start baseline-agent
      ansible.builtin.include_role:
        name: baseline.fleet.agent