---
# Baseline E2E stage 2 — introduce drift, verify detection, restore, verify clean.
# All changes happen inside the throwaway container only.
#
#   - overwrite the tracked sentinel        -> file:hash_mismatch
#   - install an untracked package (curl)   -> pkg:unauthorized:curl (snapshot mode)
#   - -check must exit 1 with both deviations listed
#   - restore baseline (sentinel + curl removed) -> -check must exit 0 again

- name: Baseline E2E — drift and detection (Ansible over Docker)
  hosts: all

  vars:
    baseline_install_dir: /usr/local/bin
    manifest_path: /etc/baseline/manifest.json
    baseline_content: "{{ lookup('file', baseline_file) }}"

  tasks:
    # ── file drift ──────────────────────────────────────────────────────────────

    - name: Introduce file drift into the sentinel
      ansible.builtin.copy:
        content: |
          # unauthorized edit
          version: 99
          state: compromised
        dest: /etc/baseline/sentinel
        mode: "0644"

    - name: Run check after file drift (expected to fail)
      ansible.builtin.command:
        argv:
          - "{{ baseline_install_dir }}/baseline-agent"
          - "-check"
          - "-manifest"
          - "{{ manifest_path }}"
      register: check_file_drift
      changed_when: false
      failed_when: false

    - name: Assert file drift detected (rc=1, hash_mismatch on the sentinel)
      ansible.builtin.assert:
        that:
          - check_file_drift.rc == 1
          - "'DRIFT' in check_file_drift.stdout"
          - "'file:hash_mismatch:/etc/baseline/sentinel' in check_file_drift.stdout"
        fail_msg: >-
          expected file drift, got rc={{ check_file_drift.rc }}
          stdout={{ check_file_drift.stdout }}

    # ── package drift (snapshot-unauthorized) ──────────────────────────────────

    - name: Install an untracked package (curl)
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Run check after package drift (expected to fail)
      ansible.builtin.command:
        argv:
          - "{{ baseline_install_dir }}/baseline-agent"
          - "-check"
          - "-manifest"
          - "{{ manifest_path }}"
      register: check_pkg_drift
      changed_when: false
      failed_when: false

    - name: Assert package drift detected (rc=1, pkg:unauthorized:curl)
      ansible.builtin.assert:
        that:
          - check_pkg_drift.rc == 1
          - "'pkg:unauthorized:curl' in check_pkg_drift.stdout"
        fail_msg: >-
          expected package drift, got rc={{ check_pkg_drift.rc }}
          stdout={{ check_pkg_drift.stdout }}

    - name: Show all deviations
      ansible.builtin.debug:
        msg: "{{ check_pkg_drift.stdout_lines }}"

    # ── suggestions + manifest signature ────────────────────────────────────────
    # Baseline reports and suggests; it never changes the node. The manifest is
    # signed at record time, so doctoring it to hide drift is itself detected.
    - name: Check reports deviations with actionable advice
      ansible.builtin.command:
        argv:
          - "{{ baseline_install_dir }}/baseline-agent"
          - "-check"
          - "-manifest"
          - "{{ manifest_path }}"
      register: advised
      changed_when: false
      failed_when: false

    - name: Assert drift is reported and explained, never enforced
      ansible.builtin.assert:
        that:
          - "'what to do:' in advised.stdout"
          - "'pkg:unauthorized:curl' in advised.stdout"
          - "'file:hash_mismatch:/etc/baseline/sentinel' in advised.stdout"
          - "'remediate' not in advised.stdout"
        fail_msg: "unexpected advisory output: {{ advised.stdout }}"

    - name: Remove the package by hand (the operator's decision, not the agent's)
      ansible.builtin.command: apt-get remove -y --purge curl
      changed_when: true

    - name: Doctor the manifest to hide the remaining drift
      ansible.builtin.shell: |
        set -eu
        chmod u+w {{ manifest_path }}
        python3 - <<'PY'
        import hashlib, json
        p = "{{ manifest_path }}"
        m = json.load(open(p))
        for f in m["files"]:
            if f["path"] == "/etc/baseline/sentinel":
                f["sha256"] = hashlib.sha256(open(f["path"], "rb").read()).hexdigest()
        json.dump(m, open(p, "w"))
        PY
        chmod 0400 {{ manifest_path }}
      changed_when: true

    - name: Check the doctored manifest
      ansible.builtin.command:
        argv:
          - "{{ baseline_install_dir }}/baseline-agent"
          - "-check"
          - "-manifest"
          - "{{ manifest_path }}"
      register: tampered
      changed_when: false
      failed_when: false

    - name: Assert the signature catches a manifest edited to hide drift
      ansible.builtin.assert:
        that:
          - tampered.rc == 2
          - "'manifest:signature_invalid' in tampered.stdout"
        fail_msg: "signature check did not detect the doctored manifest: {{ tampered.stdout }}"

    - name: Restore the file baseline (the IaS fix for file deviations)
      ansible.builtin.copy:
        content: "{{ baseline_content }}"
        dest: /etc/baseline/sentinel
        mode: "0644"

    - name: Re-record the manifest over the restored file (re-signs it)
      ansible.builtin.command:
        argv:
          - "{{ baseline_install_dir }}/baseline-agent"
          - "-write-manifest"
          - "-manifest"
          - "{{ manifest_path }}"
          - "-files"
          - "/etc/baseline/sentinel"
          - "-snapshot"
      changed_when: true


    - name: Re-run check (expected clean)
      ansible.builtin.command:
        argv:
          - "{{ baseline_install_dir }}/baseline-agent"
          - "-check"
          - "-manifest"
          - "{{ manifest_path }}"
      register: check_restored
      changed_when: false
      failed_when: check_restored.rc != 0

    - name: Assert restored clean
      ansible.builtin.assert:
        that:
          - "'OK' in check_restored.stdout"
        fail_msg: "expected clean after restore, got {{ check_restored.stdout }}"

    - name: Report restored verdict
      ansible.builtin.debug:
        msg: "restored clean: {{ check_restored.stdout | regex_search('OK: .*') }}"