groups:
  - name: baseline
    rules:
      - alert: BaselineDriftDetected
        # Alert on the always-fresh status gauge so the alert resolves as soon
        # as the node is back in compliance. The exact deviations are exposed
        # as the 'baseline_drift_details' metric (Drifted nodes dashboard panel).
        expr: baseline_drift_status == 1
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Configuration drift detected on {{ $labels.host_name }}"
          description: "baseline_drift_status=1 on {{ $labels.host_name }}. See the 'Drifted nodes' panel / baseline_drift_details for the exact deviations; re-run the provisioning playbook (IaS) or use -remediate to fix."

      - alert: BaselineCheckError
        expr: baseline_drift_status == 2
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Baseline cannot verify configuration on {{ $labels.host_name }}"
          description: "baseline_drift_status=2 on {{ $labels.host_name }}. The agent cannot read or verify its manifest. A normal install needs no OS changes — grant the service user read access to the manifest (e.g. chown baseline:root /etc/baseline/manifest.json && chmod 0400) or run the agent as root."

      - alert: BaselineNodeSilent
        expr: absent(baseline_alive)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No baseline.alive series — node silent"
          description: "The agent heartbeat is missing for {{ $labels.instance }}; the node may be down or the agent stopped."