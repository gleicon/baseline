# Prometheus config for the live Baseline E2E stack. Scrapes the OTel collector's
# Prometheus exporter (:9464) and evaluates Baseline alert rules:
#   - BaselineDriftDetected  baseline_drift_status > 0  (drift/check error)
#   - BaselineNodeSilent     absent(baseline_alive)     (no heartbeat series)
global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: baseline
    static_configs:
      - targets: ["otelcol:9464"]

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers: []