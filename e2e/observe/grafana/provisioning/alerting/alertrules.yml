apiVersion: 1
groups:
  - orgId: 1
    name: Baseline
    folder: Baseline
    interval: 10s
    rules:
      - uid: baseline-drift-alert
        title: Baseline drift detected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: baseline_drift_status == 1
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            type: reduce
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            type: threshold
            model:
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 15s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Baseline drift detected on {{ $labels.host_name }}
          description: "baseline_drift_status=1 on {{ $labels.host_name }}. See the Drifted nodes panel / baseline_drift_details for the exact deviations; the agent reports what changed and suggests options; re-run the provisioning playbook (IaS) to fix."

      - uid: baseline-check-error-alert
        title: Baseline check error
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: baseline_drift_status == 2
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            type: reduce
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            type: threshold
            model:
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 15s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Baseline cannot verify configuration on {{ $labels.host_name }}
          description: baseline_drift_status=2 on {{ $labels.host_name }}. The agent cannot read or verify its manifest. A normal install needs no OS changes — grant the service user read access to the manifest (e.g. chown baseline:root /etc/baseline/manifest.json && chmod 0400) or run the agent as root.

      - uid: baseline-node-silent-alert
        title: Baseline node silent
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: absent(baseline_alive)
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            type: reduce
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            type: threshold
            model:
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 30s
        # absent(baseline_alive) returns empty (no data) while the agent IS alive;
        # treat that as OK, not an alert. When the agent goes silent, absent()
        # returns 1 and the rule fires.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: No baseline.alive series — node silent
          description: The agent heartbeat is missing; the node may be down or the agent stopped.