name: Release

# Publishes the linux agent binaries the baseline.fleet.agent role downloads.
# The role builds the asset name as baseline-agent-linux-<arch>, so these file
# names are load-bearing: changing them breaks baseline_release_base.
#
# Tag push publishes automatically. workflow_dispatch exists to backfill a tag
# that predates this workflow (and to re-run a failed upload) without deleting
# and re-pushing a published ref.
#
# Single job on purpose: the release has to be created exactly once before any
# asset upload, which a per-arch matrix would race on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload assets for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build linux binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "baseline-agent-linux-$arch" ./cmd/agent
          done
          ls -l baseline-agent-linux-*

      # An annotated tag's body is the written changelog for the release, and
      # --generate-notes discards it: it only ever lists commit subjects. Read
      # the body back instead, and fall back to generated notes for a
      # lightweight tag, which has no body to read.
      - name: Compose the release notes from the tag annotation
        run: |
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > notes.md
          if [ -s notes.md ]; then
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md
            fi
            echo "NOTES_ARG=--notes-file=notes.md" >> "$GITHUB_ENV"
          else
            echo "NOTES_ARG=--generate-notes" >> "$GITHUB_ENV"
          fi
          cat notes.md

      - name: Ensure the release exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" $NOTES_ARG
          fi

      - name: Upload the binaries
        run: |
          gh release upload "$TAG" \
            baseline-agent-linux-amd64 \
            baseline-agent-linux-arm64 \
            --clobber
